# Rosé Pine theme for Mako
font=JetBrainsMono Nerd Font 11

background-color=#191724
text-color=#e0def4
border-color=#c4a7e7
progress-color=over #26233a

border-size=2
border-radius=0
icon-border-radius=0

padding=12
margin=10
width=380
height=150

icons=1
max-icon-size=64
icon-location=left

default-timeout=5000
ignore-timeout=0
layer=overlay
anchor=top-right

[urgency=low]
anchor=bottom-right
text-color=#908caa
border-color=#9ccfd8
default-timeout=3000

[urgency=normal]
anchor=top-right
text-color=#e0def4
border-color=#ebbcba
default-timeout=5000

[urgency=critical]
anchor=top-center
text-color=#e0def4
border-color=#eb6f92
default-timeout=0
