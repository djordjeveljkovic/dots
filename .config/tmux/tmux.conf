# Vanilla tmux (default prefix and keys) plus a theme, splits in the current
# directory, agent status bubbles and on-demand snapshots.

set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty:RGB"
set -g history-limit 25000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g focus-events on

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind x kill-pane

# Splits open in the current pane's directory.
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind a split-window -v -c "#{pane_current_path}"

# Vim-style pane movement and resizing; C-h/C-l cycle windows.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5
bind -r C-h previous-window
bind -r C-l next-window

# N: new session in this pane's directory. C-d: make this pane's directory
# the session's (new windows start there) and rename the session after it.
bind N new-session -A -c "#{pane_current_path}" -s "#{b:pane_current_path}"
bind C-d attach-session -c "#{pane_current_path}" \; rename-session "#{b:pane_current_path}"

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Rosé Pine.
set -g status-position top
set -g status-style "fg=#e0def4,bg=#191724"
set -g status-left "#[fg=#c4a7e7,bold] #S "
set -g status-left-length 30
setw -g window-status-format " #[fg=#908caa]#I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-separator ""
set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#c4a7e7"
set -g message-style "fg=#e0def4,bg=#26233a"

# One bubble per pane flagged by tmux-agent-state, across all sessions:
# pink ● = needs input, pink ✗ = error, teal = done, gold = working;
# C = Claude, X = Codex.
set -g status-right-length 120
set -g status-right "#{S:#{W:#{P:#{?@agent_state,#[fg=#{?#{m/r:input|error,#{@agent_state}},#eb6f92,#{?#{==:#{@agent_state},done},#9ccfd8,#f6c177}}]#{?#{==:#{@agent_state},error},✗,●}#[fg=#908caa]#{?#{==:#{@agent_name},codex},X,C}@#{=12:session_name}#[default] ,}}}}"

# Snapshots: prefix C-s saves, continuum autosaves every 15 min, nothing
# restores automatically; prefix C-r picks a snapshot to restore.
set -g @resurrect-capture-pane-contents on
run ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
run ~/.config/tmux/plugins/tmux-continuum/continuum.tmux
bind S run-shell -b ~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh
bind C-r display-popup -E -w 80% -h 70% -T " Snapshots " ~/.config/tmux/scripts/snapshot-picker
